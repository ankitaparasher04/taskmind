<!DOCTYPE html>
<html>

<head>
    <title>Signup</title>
    <link
        rel="stylesheet"
        href="/static/auth.css"
    >
</head>

<body>
    <div class="auth-box">
    <h1>Create Account 🚀</h1>

    <form id="signupForm">

        <input
            type="email"
            id="email"
            placeholder="Enter Email"
            required
        >

        <!-- <br><br> -->

        <input
            type="password"
            id="password"
            placeholder="Enter Password"
            required
        >

        

        <button type="submit">
            Signup
        </button>



    </form>

    </div>

    <script>

        const form =
            document.getElementById(
                "signupForm"
            )

        form.addEventListener(
            "submit",

            async (e) => {

                e.preventDefault()

                const email =
                    document.getElementById(
                        "email"
                    ).value

                const password =
                    document.getElementById(
                        "password"
                    ).value

                const response =
                    await fetch(
                        "/signup",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                "application/json"
                            },

                            body: JSON.stringify({
                                email,
                                password
                            })
                        }
                    )

                const data =
                    await response.json()

                alert(data.message)

                window.location.href =
                    "/login-page"

            }
        )

    </script>

</body>

</html>

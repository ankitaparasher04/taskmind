<!DOCTYPE html>
<html>

<head>
    <title>Dashboard</title>
    <link
        rel="stylesheet"
        href="/static/style.css"
    >
</head>

<body>

    <h1>
        Welcome To TaskMind 🚀
    </h1>

    <h2>Create Task</h2>

    <form id="taskForm">

        <input
            type="file"
            id="file"
            required
        >

        <br><br>

        <select id="task_type">

            <option value="workflow">
                Workflow Analysis
            </option>

            <option value="meeting">
                Meeting Notes
            </option>

            <option value="client">
                Client Request
            </option>

            <option value="report">
                Team Report
            </option>

        </select>

        <br><br>

        <button type="submit">
            Create Task
        </button>

    </form>

    <hr>

    <h2>Your Tasks</h2>

    <h2>Main Workflows</h2>
    <div id="mainTaskList"></div>

    <h2>Generated Subtasks</h2>
    <div id="subtaskList"></div>

    <script>
                const token =
                localStorage.getItem(
                    "token"
                )

                const form =
                    document.getElementById(
                        "taskForm"
                    )

                form.addEventListener(
                    "submit",

                    async (e) => {

            e.preventDefault()

            const task_type =
                document.getElementById(
                    "task_type"
                ).value

            const file =
                document.getElementById(
                    "file"
                ).files[0]

            const formData =
                new FormData()

            formData.append(
                "file",
                file
            )

            formData.append(
                "task_type",
                task_type
            )

            const response =
                await fetch(
                    "/tasks",
                    {
                        method: "POST",

                        headers: {
                            "Authorization":
                            "Bearer " + token
                        },

                        body: formData
                    }
                )

                const data =
                    await response.json()

                console.log(data)

                alert(data.message)

                loadTasks()

            }
        )

        async function loadTasks() {

            const response =
                await fetch(
                    "/tasks",
                    {
                        headers: {
                            "Authorization":
                            "Bearer " + token
                        }
                    }
                )

            const data =
                await response.json()
            console.log(data)

            const mainTasks = data.main_tasks
            const subtasks = data.subtasks

            const mainTaskList =
                document.getElementById("mainTaskList")

            const subtaskList =
                document.getElementById("subtaskList")

            mainTaskList.innerHTML = ""
            subtaskList.innerHTML = ""

            mainTasks.forEach(task => {

                mainTaskList.innerHTML += `
                    <div class="task-card">
                        <h3>${task.title}</h3>
                        <p class="${task.status}">
                            Status: ${task.status}
                        </p>
                        <p>
                            Progress:
                            ${task.completed_subtasks || 0} /
                            ${task.total_subtasks || 0}
                            (${task.progress || 0}%)
                        </p>
                        
                        <div class="ai-result">
                            <h4>Workflow Output</h4>
                            <pre>${task.result || "Processing..."}</pre>
                        </div>

                    </div>
                `
            })
            subtasks.forEach(task => {

                subtaskList.innerHTML += `
                    <div class="task-card">
                        <h3>${task.title}</h3>

                        <p class="${task.status}">
                            Status: ${task.status}
                        </p>

                        <p>
                            Priority: ${task.priority}
                        </p>
                        <button onclick="completeTask(${task.id})">
                            Mark Complete
                        </button>
                    </div>
                `
            })
        }

        loadTasks()
        async function completeTask(taskId) {

        await fetch(
            `/tasks/${taskId}/complete`,
            {
                method: "PUT",

                headers: {
                    "Authorization":
                    "Bearer " + token
                }
            }
        )

        loadTasks()
    }

        setInterval(
            loadTasks,
            2000
        )

    </script>

</body>

</html>

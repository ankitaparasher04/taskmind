<!DOCTYPE html>
<html>

<head>
    <title>Login</title>
    <link
    rel="stylesheet"
    href="/static/auth.css"
>
</head>

<body>

    <div class="auth-box">

        <h1>
            TaskMind Login 🚀
        </h1>

        <form id="loginForm">

            <input
                type="email"
                id="email"
                placeholder="Enter Email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Enter Password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p>
            Don't have account?
            <a href="/signup-page">
                Signup
            </a>
        </p>

    </div>

    <script>

    const form =
        document.getElementById(
            "loginForm"
        )

    form.addEventListener(
        "submit",

        async (e) => {

            e.preventDefault()

            const email =
                document.getElementById(
                    "email"
                ).value

            const password =
                document.getElementById(
                    "password"
                ).value

            const response =
                await fetch(
                    "/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                            "application/json"
                        },

                        body: JSON.stringify({
                            email,
                            password
                        })
                    }
                )

            const data =
                await response.json()

            console.log(data)

            if(data.access_token){

                localStorage.setItem(
                    "token",
                    data.access_token
                )

                window.location.href =
                    "/dashboard"

            } else {

                alert(
                    "Login Failed"
                )

            }

        }
    )

</script>

</body>
</html>
